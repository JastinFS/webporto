<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 — Not Found · Jastin Sitompul</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        height: 100%;
        background: #0a0a0a;
        color: #e8dcc4;
        font-family: Georgia, "Times New Roman", serif;
        display: grid;
        place-items: center;
        text-align: center;
      }
      .box { padding: 40px 24px; }
      .code {
        font-size: clamp(64px, 18vw, 140px);
        line-height: 1;
        color: #d4af37;
        letter-spacing: 2px;
      }
      p { color: #8a8098; font-size: 15px; margin: 14px 0 28px; }
      a {
        display: inline-block;
        padding: 12px 26px;
        border: 1px solid #d4af37;
        color: #d4af37;
        text-decoration: none;
        letter-spacing: 3px;
        font-size: 12px;
        text-transform: uppercase;
      }
      a:hover { background: #d4af37; color: #0a0a0a; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="code">404</div>
      <p>Halaman ini tidak ditemukan.</p>
      <a href="/">Kembali ke beranda</a>
    </div>
  </body>
</html>
